spring.application.name=equipment-request-service
server.port=${BACKEND_PORT:8080}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/equipment_requests}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:equipment_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:local_development_only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
# ADR-006: Redis fails fast so detail reads fall back to PostgreSQL within the timeout.
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:250ms}
spring.data.redis.connect-timeout=${SPRING_DATA_REDIS_CONNECT_TIMEOUT:250ms}

# ADR-006 cache switches (TASK-007 uses them for enabled/disabled k6 runs).
app.cache.request-detail.enabled=${APP_CACHE_REQUEST_DETAIL_ENABLED:true}
app.cache.request-detail.ttl=${APP_CACHE_REQUEST_DETAIL_TTL:10m}
app.cache.reference-data.enabled=${APP_CACHE_REFERENCE_DATA_ENABLED:true}
app.cache.reference-data.ttl=${APP_CACHE_REFERENCE_DATA_TTL:1h}

management.endpoints.web.exposure.include=health,metrics
