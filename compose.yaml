# Single Compose file for local development and Docker UI testing (TASK-009).
#   Development DB/Redis:  docker compose up -d --wait                        (backend/frontend run on the host)
#   Full stack in Docker:  docker compose --profile app up -d --build --wait  → http://localhost:${FRONTEND_PORT:-3000}/requests
#   Search seed data:      docker compose --profile app --profile seed run --rm seed
#   Playwright suite:      bash tests/e2e/run-e2e.sh                          (isolated project, removed afterwards)
#   Stop:                  docker compose --profile app down                  (add -v to delete data)
name: home-quiz

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-equipment_requests}
      POSTGRES_USER: ${POSTGRES_USER:-equipment_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-equipment_app} -d ${POSTGRES_DB:-equipment_requests}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  backend:
    profiles: ["app", "e2e"]
    build: ./backend
    image: home-quiz-backend:local
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-equipment_requests}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-equipment_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # Browsers send Origin on same-origin POST/PUT, and the frontend proxy forwards it:
      # allow the host URL and the in-network URL that Playwright uses.
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-3000},http://frontend:3000
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    profiles: ["app", "e2e"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
        API_PROXY_TARGET: http://backend:8080
    image: home-quiz-frontend:local
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  # 1,200 search/pagination requests (tests/performance/seed-search-dataset.sql); idempotent.
  seed:
    profiles: ["seed", "e2e"]
    image: postgres:17-alpine
    depends_on:
      backend: { condition: service_healthy } # Flyway creates the schema on backend start
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
    volumes:
      - ./tests/performance/seed-search-dataset.sql:/seed.sql:ro
    command: ["psql", "-q", "-v", "ON_ERROR_STOP=1", "-h", "postgres", "-U", "${POSTGRES_USER:-equipment_app}",
              "-d", "${POSTGRES_DB:-equipment_requests}", "-f", "/seed.sql"]

  # Playwright acceptance suite (tests/e2e) inside the same network as the app.
  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    depends_on:
      frontend: { condition: service_healthy }
      seed: { condition: service_completed_successfully }
    ipc: host
    working_dir: /e2e
    environment:
      E2E_BASE_URL: http://frontend:3000
      E2E_API_URL: http://backend:8080/api/v1
    volumes:
      - ./tests/e2e:/e2e
      - /e2e/node_modules
    entrypoint: ["sh", "-c", "npm ci --no-audit --no-fund > /dev/null && npx playwright test \"$@\"", "e2e"]

volumes:
  postgres_data:
  redis_data:
